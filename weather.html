<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Weather App</title>
    <style>
        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            animation: bg 8s infinite alternate;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            color: #fff;
        }

        @keyframes bg {
            0% { background: linear-gradient(135deg, #00c6ff, #0072ff); }
            100% { background: linear-gradient(135deg, #fc466b, #3f5efb); }
        }

        /* SPLASH SCREEN */
        #splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 35px; font-weight: bold;
            animation: fadeOut 2s forwards 2.5s;
            z-index: 9999;
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .loader {
            border: 6px solid #ddd;
            border-top: 6px solid #fff;
            border-radius: 50%;
            width: 45px; height: 45px;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* MAIN CARD */
        .container {
            width: 400px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        input {
            width: 100%; padding: 12px;
            border-radius: 10px;
            border: none; outline: none;
            margin-bottom: 10px;
        }

        button {
            width: 100%; padding: 12px;
            background: #fff; color: #000;
            border: none; border-radius: 10px;
            font-size: 18px; font-weight: bold;
            cursor: pointer;
        }

        img { width: 120px }

        .forecast {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-top: 20px;
        }

        .box {
            background: rgba(255,255,255,0.2);
            padding: 10px; border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash">
        Advanced Weather App
        <div class="loader"></div>
    </div>

    <div class="container">
        <h1>🌧 Weather Report</h1>
        <input id="city" placeholder="Enter city name...">
        <button onclick="getWeather()">Search</button>
        <br><br>
        <button onclick="getLocation()">Use My Location</button>

        <div id="result"></div>
        <h2>7-Day Forecast</h2>
        <div class="forecast" id="forecast"></div>
    </div>

    <script>
        let apiKey = "50f4a125b0c10daad95161d817f0be87";// Replace your API key here

        function getWeather() {
            let city = document.getElementById("city").value;
            if (!city) { alert("Enter city"); return; }

            fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`)
            .then(r => r.json())
            .then(data => showWeather(data));
        }

        function getLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                let lat = pos.coords.latitude;
                let lon = pos.coords.longitude;

                fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`)
                .then(r => r.json())
                .then(data => showWeather(data));
            });
        }

        function showWeather(data) {
            if (data.cod === "404") {
                document.getElementById("result").innerHTML = "City Not Found!";
                return;
            }

            let icon = data.weather[0].icon;

            document.getElementById("result").innerHTML = `
                <img src="https://openweathermap.org/img/wn/${icon}@2x.png">
                <h2>${data.name}</h2>
                <p>🌡 Temperature: ${data.main.temp}°C</p>
                <p>☁ Condition: ${data.weather[0].description}</p>
                <p>💧 Humidity: ${data.main.humidity}%</p>
                <p>🌬 Wind: ${data.wind.speed} m/s</p>
            `;

            getForecast(data.coord.lat, data.coord.lon);
        }

        function getForecast(lat, lon) {
            fetch(`https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&exclude=hourly,minutely&appid=${apiKey}&units=metric`)
            .then(r => r.json())
            .then(data => {
                let box = "";
                data.daily.forEach((day, i) => {
                    if (i < 7) {
                        box += `
                            <div class='box'>
                                <p>${new Date(day.dt * 1000).toLocaleDateString()}</p>
                                <img src="https://openweathermap.org/img/wn/${day.weather[0].icon}.png">
                                <p>${day.temp.day}°C</p>
                            </div>
                        `;
                    }
                });
                document.getElementById("forecast").innerHTML = box;
            });
        }
    </script>

</body>
</html>
